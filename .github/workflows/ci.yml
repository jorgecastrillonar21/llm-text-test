name: CI

on:
  push:
    # `master` is this repository's default and only long-lived branch. The
    # filter said `main`, so no push ever triggered CI and every green run came
    # from a pull request that nobody was opening.
    branches: [master]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first. This is a personal project,
# not a release pipeline, and stale runs are just noise.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install Python
        # Pinned to the floor declared by requires-python, so CI cannot pass on a
        # newer interpreter than the project claims to support.
        run: uv python install 3.13

      - name: Sync dependencies
        # --locked fails if uv.lock is stale relative to pyproject.toml, rather than
        # silently re-resolving and testing something the repo does not describe.
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        # mypy was installed and configured from the start but never executed, so
        # `disallow_untyped_defs` was decorative. Running it here makes it a gate.
        run: uv run mypy app

      - name: Test
        # No Ollama, no ComfyUI: every test uses the mock provider or an isolated
        # temporary SQLite database.
        run: uv run pytest -q

  frontend:
    name: Frontend (lint + typecheck + test + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:web

      - name: Typecheck
        # `typecheck:web`, not `typecheck`: the root script now also runs mypy,
        # and this job deliberately has no Python toolchain installed.
        run: pnpm typecheck:web

      - name: Test
        run: pnpm test:web

      - name: Build
        run: pnpm build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync backend
        run: uv sync --locked
        working-directory: apps/api

      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Migrate database
        run: pnpm db:migrate

      - name: Start API
        # STORY_PROVIDER=mock is explicit: the E2E suite must never depend on a
        # model being present. A missing Ollama is a hard error by design, not a
        # silent fallback, so it would fail the run rather than skip a test.
        run: |
          node scripts/uv.mjs run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health
        env:
          STORY_PROVIDER: mock
          IMAGE_PROVIDER: disabled

      - name: Run E2E
        # Playwright starts Vite itself; the API above is the part it cannot start.
        run: pnpm test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
